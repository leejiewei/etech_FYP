name: etech_mobile
description: eTech Computer Accessories - customer mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # Talks to Supabase directly — the catalogue, the account, the basket
  # and the orders. Replaces the http package, which was only ever here to
  # call the shop's PHP API, and shared_preferences, which was only ever
  # here to remember the PHPSESSID cookie and the server address. This
  # package keeps the session itself.
  supabase_flutter: ^2.8.0

  # Back, and for one key only: anon_id. It is the id this phone gives
  # itself so that what somebody browses before signing in can be joined
  # to the account they eventually make. It has to outlive the app being
  # closed, which rules out holding it in memory, and it cannot live in
  # the Supabase session because the whole point is that there is no
  # session yet. supabase_flutter already depends on this package for its
  # own session storage, so this promotes a transitive dependency to a
  # named one rather than adding anything new.
  shared_preferences: ^2.5.0

  # Draws the product illustrations, which are SVG files bundled in assets/
  flutter_svg: ^2.0.16

  # Photographing a bank transfer receipt at the checkout. The shop has no
  # payment gateway -- customers pay from their own banking app and send
  # the receipt -- so the one thing the phone genuinely has that the
  # website does not is a camera pointed at the screen the receipt is on.
  # Android 13 and up route this through the system photo picker, which
  # hands over the one chosen file and needs no gallery permission.
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # The drawn illustrations, copied from web/images. They used to be
  # fetched from the website over HTTP, which meant a product picture
  # depended on a web server being reachable. Bundling them is 110KB and
  # removes that dependency entirely.
  assets:
    - assets/images/
