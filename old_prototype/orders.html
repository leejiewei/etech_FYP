<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order History - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <h2>Order History</h2>
    <div id="orders-list" style="max-width: 700px; margin: 0 auto;"></div>
  </section>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      const list = document.getElementById("orders-list");

      if (!user.orders || user.orders.length === 0) {
        list.innerHTML = `<p style="text-align:center; color:#777;">No orders yet. <a href="shop.html">Start shopping</a></p>`;
        return;
      }

      list.innerHTML = user.orders.slice().reverse().map((order) => `
        <div class="prebuilt-card" style="margin-bottom: 16px;">
          <h3>Order #${order.id}</h3>
          <p class="product-category">${new Date(order.date).toLocaleString()}</p>
          <ul class="prebuilt-specs">
            ${order.items.map((item) => `<li>${item.qty} x ${item.name} - RM ${(item.price * item.qty).toFixed(2)}</li>`).join("")}
          </ul>
          <p class="prebuilt-price">Total: RM ${order.total.toFixed(2)}</p>
          <p class="product-category">Shipping to: ${order.address}</p>
        </div>
      `).join("");
    });
  </script>
</body>
</html>
