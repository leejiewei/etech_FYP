<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <div class="form-page">
      <h2>My Profile</h2>
      <form id="profile-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" />

        <label for="email">Email</label>
        <input type="email" id="email" disabled />

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="e.g. 012-3456789" />

        <label for="address">Shipping Address</label>
        <textarea id="address" rows="3" placeholder="Street, city, postcode, state"></textarea>

        <div class="form-error" id="profile-saved" style="color: #1e8e3e;"></div>

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("name").value = user.name;
      document.getElementById("email").value = user.email;
      document.getElementById("phone").value = user.phone || "";
      document.getElementById("address").value = user.address || "";
    });

    document.getElementById("profile-form").addEventListener("submit", (e) => {
      e.preventDefault();
      updateProfile({
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
      });
      document.getElementById("profile-saved").textContent = "Profile saved!";
    });
  </script>
</body>
</html>
