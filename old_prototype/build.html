<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Build Your Own PC - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <h2>Build Your Own PC</h2>
    <p style="text-align:center; color:#666; margin-bottom: 12px;">
      Pick one part per slot. Once you choose a CPU, incompatible motherboards, RAM and coolers are hidden
      automatically — and the Build Summary below checks cooling, case fit, card length and power for you.
    </p>

    <p style="text-align:center; font-size: 13px; color:#888; margin-bottom: 8px;">Filter by Brand</p>
    <div class="filter-bar" id="builder-brand-filter" style="margin-bottom: 30px;"></div>

    <div class="builder-slots" id="builder-slots"></div>

    <div class="builder-summary">
      <h3>Build Summary</h3>
      <div id="compat-messages"></div>
      <p class="subtotal">Subtotal: <span id="builder-subtotal">RM 0.00</span></p>
      <button class="hero-btn" id="add-build-btn" style="width:100%; margin-top: 14px;" onclick="addBuildToCart()" disabled>
        Add Build to Cart
      </button>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/build.js"></script>
</body>
</html>
