<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <div class="form-page">
      <h2>Login</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <div class="form-error" id="login-error"></div>

        <button type="submit">Login</button>
      </form>
      <p class="form-note">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const errorMessage = loginUser(email, password);
      if (errorMessage) {
        document.getElementById("login-error").textContent = errorMessage;
        return;
      }

      window.location.href = "index.html";
    });
  </script>
</body>
</html>
