<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deals - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <!-- Counts down to the first deal that ends, and hides itself when
       there are none running. -->
  <div class="countdown-banner">
    <p>⚡ First Deal Ends In</p>
    <span id="countdown">00:00:00</span>
  </div>

  <section class="section">
    <h2>Today's Deals</h2>
    <p class="section-sub">A price on the product itself, until the clock runs out.
      No code to type.</p>
    <p id="no-timed-deals" style="display:none; text-align:center; color:#888;">
      No timed deals are running right now.
    </p>
    <div class="product-grid" id="timed-deal-grid"></div>
  </section>

  <section class="section">
    <h2>Promotion Codes</h2>
    <p class="section-sub">Type one of these at the checkout for money off a whole category.</p>
    <div class="filter-bar" id="deal-chips"></div>
    <div class="deal-grid" id="deal-grid"></div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
