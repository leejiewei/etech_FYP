<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <div class="form-page">
      <h2>My Profile</h2>
      <form id="profile-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" autocomplete="name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" disabled />

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="tel" autocomplete="tel" inputmode="tel"
          placeholder="e.g. 012-3456789" />

        <!-- Optional. Used to save typing at checkout if the customer
             chooses delivery; an order that is collected never reads it. -->
        <label for="address">Address (optional)</label>
        <textarea id="address" name="street-address" autocomplete="street-address" rows="3"
          placeholder="Street, city, postcode, state"></textarea>

        <div class="form-error" id="profile-saved" style="color: #1e8e3e;"></div>

        <button type="submit">Save Changes</button>
      </form>

      <!-- Changing the password signs every other device out. See
           changePassword() in js/auth.js for why that matters. -->
      <h2 style="margin-top: 36px;">Change Password</h2>
      <p class="sub" style="margin-top: -8px; color: #666;">
        Changing your password signs you out everywhere except this device.
      </p>
      <form id="password-form">
        <label for="current-password">Current Password</label>
        <input type="password" id="current-password" autocomplete="current-password" />

        <label for="new-password">New Password</label>
        <input type="password" id="new-password" autocomplete="new-password"
          minlength="8" placeholder="At least 8 characters" />

        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" autocomplete="new-password" />

        <div class="form-error" id="password-result"></div>

        <button type="submit">Change Password</button>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    onAppReady(() => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("name").value = user.name;
      document.getElementById("email").value = user.email;
      document.getElementById("phone").value = user.phone || "";
      document.getElementById("address").value = user.address || "";
    });

    document.getElementById("profile-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const savedEl = document.getElementById("profile-saved");
      savedEl.textContent = "Saving...";

      updateProfile({
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
      }).then((errorMessage) => {
        savedEl.textContent = errorMessage || "Profile saved!";
        savedEl.style.color = errorMessage ? "#c0392b" : "#1e8e3e";
      });
    });

    document.getElementById("password-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const resultEl = document.getElementById("password-result");
      const button = e.target.querySelector("button[type=submit]");

      resultEl.style.color = "#666";
      resultEl.textContent = "Changing...";
      button.disabled = true;

      changePassword(
        document.getElementById("current-password").value,
        document.getElementById("new-password").value,
        document.getElementById("confirm-password").value
      ).then((errorMessage) => {
        button.disabled = false;

        if (errorMessage) {
          resultEl.textContent = errorMessage;
          resultEl.style.color = "#c0392b";
          return;
        }

        // Clear the boxes: three passwords left sitting in a form on a
        // shared machine is the problem this page is meant to fix.
        e.target.reset();
        resultEl.textContent =
          "Password changed. Any other device signed into this account has been signed out.";
        resultEl.style.color = "#1e8e3e";
      });
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
