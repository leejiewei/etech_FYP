<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password - eTech Computer Accessories</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="images/brand/etech-logo-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <div class="form-page">
      <h2>Forgot your password?</h2>

      <p class="form-note" style="text-align: left; margin-top: 0;">
        Type the email address you registered with. We will send a link that lets
        you set a new password. Nobody here can read your old one — it is not
        stored anywhere, only a scrambled version of it is.
      </p>

      <form id="forgot-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />

        <div class="form-error" id="forgot-error"></div>

        <button type="submit" id="forgot-submit">Send the link</button>
      </form>

      <div class="form-ok" id="forgot-sent" hidden></div>

      <p class="form-note">
        Remembered it? <a href="login.html">Back to login</a>
      </p>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    const forgotForm   = document.getElementById("forgot-form");
    const forgotError  = document.getElementById("forgot-error");
    const forgotSent   = document.getElementById("forgot-sent");
    const forgotButton = document.getElementById("forgot-submit");

    forgotForm.addEventListener("submit", (e) => {
      e.preventDefault();
      forgotError.textContent = "";

      // One of these per address per minute, so the button is taken away
      // for the round trip rather than left ready to be pressed again by
      // somebody who thinks nothing happened.
      forgotButton.disabled = true;
      forgotButton.textContent = "Sending…";

      const email = document.getElementById("email").value.trim();

      requestPasswordReset(email).then((result) => {
        if (!result.ok) {
          forgotError.textContent = result.message;
          forgotButton.disabled = false;
          forgotButton.textContent = "Send the link";
          return;
        }

        // Success hides the form entirely. Leaving it on screen invites a
        // second press, which the one-a-minute limit would refuse and
        // which would read as the first one having failed.
        forgotForm.hidden = true;
        forgotSent.textContent = result.message;
        forgotSent.hidden = false;
      });
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
