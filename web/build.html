<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build Your Own PC - eTech Computer Accessories</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="images/brand/etech-logo-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="has-bp-bar">

  <div id="site-header"></div>

  <section class="section bp">
    <div class="bp-hero">
      <div>
        <h2>Build Your Own PC</h2>
        <p>Choose one part for each step. Pick a CPU first and we only offer the boards, memory
          and coolers that work with it.</p>
      </div>
      <div class="bp-progress" id="bp-progress"></div>
    </div>

    <div class="bp-layout">
      <div>
        <div class="bp-toolbar">
          <button type="button" class="bp-tool" id="bp-copy">Copy Specs</button>
          <button type="button" class="bp-tool" id="bp-reset">Start Over</button>
        </div>
        <div class="bp-slots" id="builder-slots"></div>
      </div>

      <aside class="bp-side">
        <!-- The total and the buttons. On a phone this block pins itself
             to the bottom of the window. -->
        <div class="bp-checkout">
          <div class="bp-checkout-info">
            <span id="bp-count">No parts selected</span>
            <strong id="builder-subtotal">RM 0.00</strong>
          </div>
          <button class="bp-checkout-add" id="add-build-btn" onclick="addBuildToCart()" disabled>Add Build to Cart</button>
          <a class="bp-checkout-talk" id="bp-talk" target="_blank" rel="noopener">Ask us on WhatsApp</a>
        </div>
        <h3>Compatibility</h3>
        <div id="bp-power"></div>
        <div id="compat-messages"></div>
      </aside>
    </div>
  </section>

  <!-- The part picker: a drawer from the right, refilled for whichever
       part was clicked. -->
  <div class="bp-picker" id="bp-picker" hidden>
    <div class="bp-picker-box" role="dialog" aria-modal="true" aria-labelledby="bp-picker-title">
      <div class="bp-picker-head">
        <h3 id="bp-picker-title"></h3>
        <button type="button" class="bp-picker-close" id="bp-picker-close" aria-label="Close">&times;</button>
      </div>
      <input type="search" class="bp-search" id="bp-search" placeholder="Search" autocomplete="off" />
      <div class="bp-tabs" id="bp-tabs"></div>
      <div class="bp-list" id="bp-list"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/build.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
