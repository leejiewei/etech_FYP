<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <div class="form-page">
      <h2>Login</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />

        <div class="form-error" id="login-error"></div>

        <button type="submit">Login</button>
      </form>
      <p class="form-note"><a href="forgot-password.html">Forgot your password?</a></p>
      <p class="form-note">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // The server checks the password, so this waits for its answer.
      loginUser(email, password).then((errorMessage) => {
        // Staff at the shop's door: right password, wrong door. Send
        // them to the staff one with their email already filled in, so
        // the only thing left to type is the password. It cannot be
        // skipped entirely -- the admin pages hold their own separate
        // session, which is the point of them being separate.
        if (errorMessage === "staff") {
          window.location.href = "staff-console/login.html?staff=" + encodeURIComponent(email);
          return;
        }
        if (errorMessage) {
          document.getElementById("login-error").textContent = errorMessage;
          return;
        }
        // Come back to whatever page sent us here, if any.
        const returnTo = sessionStorage.getItem("returnTo");
        sessionStorage.removeItem("returnTo");
        window.location.href = returnTo || "index.html";
      });
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
