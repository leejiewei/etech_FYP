<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section shop">
    <!-- Tick-box filters down the side, after suncycle.com.my's category
         pages. On a phone the panel folds up behind a Filters button. -->
    <details class="shop-side" id="shop-side" open>
      <summary class="shop-side-toggle">Filters</summary>
      <input type="search" id="shop-search" class="shop-search"
        placeholder="Search products or brands..." oninput="handleSearchInput(this.value)" />
      <div id="shop-facets"></div>
    </details>

    <div class="shop-main">
      <p class="shop-crumbs"><a href="index.html">Home</a> &rsaquo; <span id="shop-crumb">All Products</span></p>
      <h2 class="shop-title" id="shop-title">All Products</h2>
      <div class="shop-chips" id="shop-chips"></div>

      <div class="shop-bar">
        <span id="shop-count"></span>
        <select id="sort-select" class="attr-select" onchange="handleSortChange(this.value)">
          <option value="default">Sort by: Default</option>
          <option value="brand">Brand (A-Z)</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>

      <!-- What the filters are answering. Scrolled to by name when a
           mega-menu tile is picked, so the answer arrives on screen
           instead of being left below the fold. -->
      <div id="product-grid-top"></div>
      <p id="no-results">No products match your filters.</p>
      <div class="product-grid" id="product-grid"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
