<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register - eTech Computer Accessories</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="images/brand/etech-logo-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <div class="form-page">
      <h2>Create an Account</h2>
      <form id="register-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" autocomplete="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="new-password" autocomplete="new-password" required minlength="8" />

        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm-password" autocomplete="new-password" required minlength="8" />

        <!-- What the home page's "Picked for you" leans on before this
             account has any history. Changeable later on the profile page. -->
        <label for="role">I am shopping as a…</label>
        <select id="role" name="role" required>
          <option value="" disabled selected>Choose one</option>
          <option value="student">Student: laptops and study gear on a budget</option>
          <option value="gamer">Gamer: GPUs, gaming PCs and peripherals</option>
          <option value="enterprise">Enterprise: office PCs, printers and networking</option>
        </select>

        <div class="form-error" id="register-error" role="alert"></div>
        <div class="form-ok" id="register-ok" role="status" hidden></div>

        <button type="submit">Create account</button>
      </form>
      <p class="form-note">
        Already have an account? <a href="login.html">Login here</a><br />
        Note: this is a student demo project, please don't use a real password.
      </p>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      const role = document.getElementById("role").value;
      const errorEl = document.getElementById("register-error");
      const okEl = document.getElementById("register-ok");
      const button = e.target.querySelector("button[type=submit]");
      errorEl.textContent = "";
      okEl.hidden = true;

      if (password !== confirm) {
        errorEl.textContent = "Passwords do not match.";
        return;
      }

      // Disabled while the request is out, so a double click cannot send
      // two sign-ups (and two emails against the hourly allowance).
      button.disabled = true;
      registerUser(name, email, password, role).then((result) => {
        button.disabled = false;
        if (!result.ok) {
          errorEl.textContent = result.message;
          return;
        }

        // Made, but the address has to be confirmed before there is a
        // session. Staying on this page and saying so is the whole point
        // -- redirecting to the home page signed out would look like the
        // sign-up had quietly failed.
        // Only reached when Supabase accepted the sign-up, so the green
        // box never appears for a refused one.
        if (result.message) {
          e.target.reset();
          okEl.textContent = result.message;
          okEl.hidden = false;
          return;
        }

        window.location.href = "index.html";
      });
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
