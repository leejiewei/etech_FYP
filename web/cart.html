<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <h2>Your Cart</h2>

    <p id="cart-empty">Your cart is empty. <a href="shop.html">Go shopping</a></p>

    <table class="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cart-body"></tbody>
    </table>

    <div class="cart-summary">
      <p>Total: <strong id="cart-total">RM 0.00</strong></p>
      <p style="margin-top: 14px;">
        <a href="checkout.html" class="hero-btn" style="display:inline-block;">Proceed to Checkout</a>
      </p>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/compare.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script>
    onAppReady(renderCartPage);
  </script>
  <script src="js/app.js"></script>
</body>
</html>
