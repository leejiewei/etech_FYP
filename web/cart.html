<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart - eTech Computer Accessories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="site-header"></div>

  <section class="section cart-page">
    <h2>Your cart</h2>

    <p id="cart-empty">Your cart is empty. <a href="shop.html">Go shopping</a></p>

    <div class="receipt cart-receipt">
      <div class="till-head">
        <span class="logo-mark">eTech</span>
        <span class="till-meta">Computer Accessories<br>Prices in RM</span>
      </div>

      <table class="cart-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th><span class="visually-hidden">Remove</span></th>
          </tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>

      <div class="cart-summary">
        <div class="till-total"><span>Total</span><span class="till-sum" id="cart-total">RM 0.00</span></div>
        <a href="checkout.html" class="hero-btn cart-checkout">Check out</a>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    onAppReady(renderCartPage);
  </script>
  <script src="js/app.js"></script>
</body>
</html>
