<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a New Password - eTech Computer Accessories</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="images/brand/etech-logo-180.png" />
  <link rel="stylesheet" href="css/style.css" />

  <script>
    // ============================================================
    // Read the address bar before anything else can.
    //
    // This runs in the <head>, above the Supabase client, and that
    // ordering is the whole point. The recovery link arrives carrying its
    // token in the URL; the client reads that token the moment it is
    // created in db.js, swaps it for a session, and wipes it out of the
    // address bar so it cannot be read over a shoulder or left sitting in
    // browser history. By the time the page's own script runs, the
    // evidence that this was a recovery link is gone.
    //
    // So it is copied out here first. What is kept is only the fact that
    // a recovery token was present — never the token itself.
    //
    // Why the page needs to know at all: the session a recovery link
    // creates is an ordinary one, indistinguishable afterwards from
    // being logged in normally. Without this flag the page would happily
    // offer "set a new password, no old password needed" to anyone who
    // was already signed in, which is changePassword() with its guard
    // removed — an unlocked laptop would be enough to take the account.
    //
    // Both shapes are read. Supabase's implicit flow puts the token in
    // the fragment (#type=recovery&…); its PKCE flow puts a ?code= in the
    // query string. The project uses the first, and the second is here so
    // that switching would not silently break this page.
    // ============================================================
    window.RECOVERY_ARRIVAL = (function () {
      const hash  = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const query = new URLSearchParams(window.location.search);
      return {
        isRecovery: hash.get("type") === "recovery" || query.has("code"),
        errorCode:  hash.get("error_code")        || query.get("error_code")        || "",
        errorText:  hash.get("error_description") || query.get("error_description") || "",
      };
    })();
  </script>
</head>
<body>

  <div id="site-header"></div>

  <section class="section">
    <div class="form-page">
      <h2>Set a new password</h2>

      <!-- Which of these three is shown is decided at the bottom of the
           page, once the client has had a chance to turn the link into a
           session. Starting hidden means a stale link never flashes a
           form the customer cannot submit. -->

      <p id="reset-checking" class="form-note" style="text-align: left; margin-top: 0;">
        Checking your link…
      </p>

      <form id="reset-form" hidden>
        <p class="form-note" style="text-align: left; margin-top: 0;">
          Choose a new password for <strong id="reset-email"></strong>.
          At least 8 characters.
        </p>

        <!-- Present, filled in, and never shown. A password form with no
             username field leaves a password manager with nothing to file
             the new password under, so it either saves it against nothing
             or does not offer to save it at all. The customer cannot edit
             it: which account is being recovered was settled by the link,
             not by this page. -->
        <input type="email" id="reset-username" name="username"
               autocomplete="username" readonly tabindex="-1"
               style="display: none;" />

        <label for="password">New password</label>
        <input type="password" id="password" name="password"
               autocomplete="new-password" required />

        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm"
               autocomplete="new-password" required />

        <div class="form-error" id="reset-error"></div>

        <button type="submit" id="reset-submit">Set password</button>
      </form>

      <div id="reset-dead" hidden>
        <div class="form-error" id="reset-dead-message"></div>
        <p class="form-note" style="text-align: left;">
          Reset links expire 15 minutes after they are sent, and each one
          works only once.
        </p>
        <p class="form-note">
          <a href="forgot-password.html">Ask for a new link</a>
          &nbsp;·&nbsp;
          <a href="login.html">Back to login</a>
        </p>
      </div>

      <div class="form-ok" id="reset-done" hidden></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Supabase client, then where the project is, then the connection. -->
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/db.js"></script>
  <script src="js/products.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/deals.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/chatbot.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    const arrival      = window.RECOVERY_ARRIVAL;
    const checkingBox  = document.getElementById("reset-checking");
    const resetForm    = document.getElementById("reset-form");
    const resetError   = document.getElementById("reset-error");
    const resetButton  = document.getElementById("reset-submit");
    const deadBox      = document.getElementById("reset-dead");
    const deadMessage  = document.getElementById("reset-dead-message");
    const doneBox      = document.getElementById("reset-done");

    function showDead(message) {
      checkingBox.hidden = true;
      resetForm.hidden = true;
      deadMessage.textContent = message;
      deadBox.hidden = false;
    }

    // ------------------------------------------------------------
    // Waiting for the session the link is about to become.
    //
    // The client reads the token out of the URL on its own, without being
    // asked, and does it asynchronously — so a session may or may not
    // exist by the time this script runs, depending on how quickly the
    // network answered. Rather than guess, this asks repeatedly for a few
    // seconds and gives up if nothing appears.
    //
    // Polling rather than onAuthStateChange because the event can fire
    // before this file is parsed at all: db.js is four <script> tags
    // above, and a listener attached afterwards would never hear it.
    // ------------------------------------------------------------
    function waitForSession(msLeft) {
      return sb.auth.getSession().then(({ data }) => {
        if (data && data.session) return data.session;
        if (msLeft <= 0) return null;
        return new Promise((resolve) => setTimeout(resolve, 100))
          .then(() => waitForSession(msLeft - 100));
      });
    }

    // Supabase answers a dead link by redirecting here with the reason in
    // the URL instead of a token, so this is the expected shape of an
    // expired one rather than an unusual failure.
    if (arrival.errorCode || arrival.errorText) {
      const expired = (arrival.errorCode + " " + arrival.errorText).toLowerCase().includes("expired");
      showDead(expired
        ? "That link has expired."
        : "That link cannot be used. " + (arrival.errorText || ""));
    } else if (!arrival.isRecovery) {
      // Somebody typed the address in, or followed a bookmark. Note that
      // being signed in does not help them here, deliberately: changing a
      // known password is what the profile page is for.
      showDead("This page only works from the link in a password reset email.");
    } else {
      waitForSession(5000).then((session) => {
        if (!session) {
          showDead("That link has expired, or it has already been used.");
          return;
        }
        checkingBox.hidden = true;
        const email = session.user.email || "";
        document.getElementById("reset-email").textContent = email || "your account";
        document.getElementById("reset-username").value = email;
        resetForm.hidden = false;
      });
    }

    resetForm.addEventListener("submit", (e) => {
      e.preventDefault();
      resetError.textContent = "";
      resetButton.disabled = true;
      resetButton.textContent = "Setting…";

      completePasswordReset(
        document.getElementById("password").value,
        document.getElementById("confirm").value
      ).then((errorMessage) => {
        if (errorMessage) {
          resetError.textContent = errorMessage;
          resetButton.disabled = false;
          resetButton.textContent = "Set password";
          return;
        }

        // The recovery session is a real one, so they are already signed
        // in and there is nothing left to type. Sent to the shop rather
        // than back to the login form they have just been rescued from.
        resetForm.hidden = true;
        doneBox.textContent = "Password set. Signing you in…";
        doneBox.hidden = false;
        setTimeout(() => { window.location.href = "index.html"; }, 1200);
      });
    });
  </script>
  <script src="js/app.js"></script>
</body>
</html>
